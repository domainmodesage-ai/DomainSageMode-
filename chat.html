<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Domain Sage Mode</title>
  <!-- Favicon -->
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/chat.css">
  <script src="assets/seo.js"></script>
</head>
<body>
<header>
  <div class="logo-header">
    <img src="assets/logo.png" alt="Logo" class="logo-bulat">
    <h1 class="judul-logo">DOMAIN SAGE MODE</h1>
  </div>
</header>

<nav>
  <a href="index.html">Kembali Ke Menu</a>
</nav>

<main class="chat-container">
  <section class="chat-box">
    <div class="chat-header">
      <span id="chatHeader">Chat Global</span>
    </div>

    <!-- Chat Global -->
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Ketik pesan...">
      <button id="sendBtn">Kirim</button>
    </div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCLNAy5hq67QmITgG1yHM_yhtxAQDBF3Gc",
    authDomain: "domainsagemode.firebaseapp.com",
    databaseURL: "https://domainsagemode-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "domainsagemode",
    storageBucket: "domainsagemode.appspot.com",
    messagingSenderId: "849850359664",
    appId: "1:849850359664:web:1d08e70a318c02d9ec79b5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const chatMessages = document.getElementById("chatMessages");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  let currentUser = null;

  // cek login user
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      initChat();
    } else {
      alert("Silakan login terlebih dahulu untuk mengirim pesan.");
      window.location.href = "register.html";
    }
  });

  function initChat() {
    // kirim pesan
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });

    // tampilkan pesan real-time
    const chatRef = ref(db, "chatGlobal");
    onChildAdded(chatRef, snapshot => {
      const msg = snapshot.val();
      displayMessage(msg);
    });
  }

  function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    const chatRef = ref(db, "chatGlobal");
    push(chatRef, {
      userId: currentUser.uid,
      username: currentUser.displayName || currentUser.email,
      photo: "assets/default-avatar.png", // bisa ambil dari database user
      text: text,
      timestamp: serverTimestamp()
    });

    messageInput.value = "";
  }

  function displayMessage(msg) {
    const div = document.createElement("div");
    div.className = "chat-message";

    div.innerHTML = `
      <img src="${msg.photo}" alt="avatar" class="chat-avatar">
      <div class="chat-text">
        <strong>${msg.username}</strong>
        <p>${msg.text}</p>
      </div>
    `;

    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight; // auto scroll
  }
</script>
</body>
</html>
